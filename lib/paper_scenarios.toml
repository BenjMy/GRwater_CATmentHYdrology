# "Good one" of to_run_paper.md. The old shell recipe passed "${KS_VALUES}", which expands
# to the FIRST element only (1e-4); the loop below really runs the three Ks values.
[paper_good]
description = "dem 3, PMIN -50/-1e35, outlet+bottom both, IC both (-100 m), Ks 1e-4/6e-4/1e-3, deeper rooting"
tags = ["paper", "ks", "pmin", "bc"]
[paper_good.args]
dem-plot = ["3"]
pmin = ["-50", "-1e35"]
outlet = "both"
bottom = "both"
ic = "both"
ic-pressure-head = "-100"
zroot-factors = ["0.3", "0.6", "2.0", "3.0", "5.0"]
[paper_good.loop]
permx = ["1e-4", "6e-4", "1e-3"]

