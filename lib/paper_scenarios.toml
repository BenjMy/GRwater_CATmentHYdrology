# paper_scenarios.toml - Agramon paper runs (replaces the copy-paste blocks of to_run_paper.md)
# =========================================================================================
# One table per scenario. [name.args]: CLI options of run_scenarii_withETp_withLAI_ALL.sh
#   scalar -> "--key value" | list -> "--key v1 v2 ..." (multi-value flags) | true -> "--key"
# [name.loop] (optional): one runner call per combination (cartesian product) of the listed
#   options; each entry is a scalar or a list (a list is ONE value, e.g. a root-depth set).
# Write numbers as strings so they reach the shell exactly as typed ("1e-4", "-1e35").
#   python run_paper_scenarios.py --list
#   python run_paper_scenarios.py --only paper_good --dry-run
# Root-depth sets: baseline 0.1 0.3 1.0 1.5 2.5 | deeper 0.3 0.6 2.0 3.0 5.0 | uniform 2.5 (x5)

[baseline_zroot_dem3]
description = "dem 3, PMIN -1e34/-15, baseline vs uniform 2.5 root depth, Ks 1e-4 (first block of to_run_paper.md)"
tags = ["baseline", "zroot"]
[baseline_zroot_dem3.args]
dem-plot = ["3"]
pmin = ["-1e34", "-15"]
outlet = "closed"
bottom = "closed"
ic = "pressure"
permx = "1e-4"
[baseline_zroot_dem3.loop]
zroot-factors = [["0.1", "0.3", "1.0", "1.5", "2.5"], ["2.5", "2.5", "2.5", "2.5", "2.5"]]

[baseline_zroot_dem32]
description = "dem 3 and 2, PMIN -1e34/-15, baseline vs deeper rooting, Ks 1e-4"
